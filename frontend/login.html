<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5D3B">
  <title>Log in - AmataShield</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <a href="/"><img class="logo" src="/assets/logo.svg" alt="AmataShield"></a>
    <div class="card">
      <h1>Welcome back</h1>
      <p class="muted">Log in with your phone number.</p>
      <form id="login" novalidate>
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="username" placeholder="0788 123 456" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div id="err" class="err hidden" role="alert"></div>
        <button class="btn gold block mt14" type="submit">Log in</button>
      </form>
      <p class="center mt14">New here? <a href="/register.html">Create an account</a></p>
    </div>
    <p class="muted small center">AmataShield records dairy deals and evidence. It is not a bank, escrow service or laboratory.</p>
  </div>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
